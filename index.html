<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyQuiz - Vos Défis Quotidiens</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 100%;
    }
    h1 { margin-top: 0; color: #38bdf8; font-size: 2rem; }
    p { color: #94a3b8; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 12px 24px;
      background-color: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DailyQuiz 🧭</h1>
    <p>Le nouveau rendez-vous quotidien du casse-tête.</p>
    <a href="/geo/" class="btn">Découvrir le défi Géographie</a>
  </div>
</body>
</html>
